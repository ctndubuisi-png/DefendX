<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Team Dashboard</h2>
        <ul>
            <li><a href="#team-stats">Team Statistics</a></li>
            <li><a href="#player-roster">Player Roster</a></li>
            <li><a href="#team-rating">Team Rating</a></li>
            <li><a href="#drill-assignment">Drill Assignments</a></li>
        </ul>
    </div>
    <div class="main-content">
        <section id="team-stats">
            <h2>Team Statistics</h2>
            <!-- Team statistics cards go here -->
        </section>
        <section id="player-roster">
            <h2>Player Roster</h2>
            <table>
                <tr>
                    <th>Player Name</th>
                    <th>Position</th>
                    <th>Performance Metric 1</th>
                    <th>Performance Metric 2</th>
                </tr>
                <!-- Player rows go here -->
            </table>
        </section>
        <section id="team-rating">
            <h2>Team Rating</h2>
            <!-- Team rating ring chart goes here -->
        </section>
        <section id="drill-assignment">
            <h2>Drill Assignments</h2>
            <!-- Drill assignments go here -->
        </section>
    </div>
</body>
</html>
